<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in - Soen AI Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-icon">⚡</div>
            <h2>Soen AI</h2>
        </div>
        <h1>Welcome back</h1>
        <p class="sub">Log in to collaborate on code with your team & Soen AI.</p>
        <div class="error-msg" id="errorMsg"></div>
        <form id="loginForm">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email" autofocus>
            </div>
            <div class="field">
                <div class="field-label-row">
                    <label for="password">Password</label>
                    <a href="forgot-password.php" class="forgot-link">Forgot?</a>
                </div>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary" type="submit">Log in to Workspace</button>
        </form>
        <div class="switch-link">Don't have an account? <a href="register.html">Create one for free</a></div>
    </div>
</div>
<script src="assets/js/auth.js"></script>
</body>
</html>
