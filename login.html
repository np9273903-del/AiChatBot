<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In | Soen AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap">
<link rel="stylesheet" href="assets/css/auth-clean.css?v=20.0">
</head>
<body class="auth-clean-body">

<!-- Header Logo -->
<header class="auth-clean-header">
    <a href="login.html" class="auth-clean-logo">
        <span class="logo-word">Soen</span><span class="logo-badge">AI</span>
    </a>
</header>

<div class="auth-clean-wrapper">
    <main class="auth-clean-container">
        <!-- LinkedIn-style warm terracotta serif heading -->
        <h1 class="auth-clean-title">Welcome to your<br>professional community</h1>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm" class="auth-clean-form">
            <div class="auth-field">
                <label for="email">Email or phone</label>
                <input type="email" id="email" name="email" required autocomplete="email" autofocus>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <div class="auth-pw-wrap">
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <button type="button" class="auth-pw-toggle" data-target="password">Show</button>
                </div>
            </div>

            <a href="forgot-password.php" class="auth-forgot-link">Forgot password?</a>

            <button class="btn-auth-primary" type="submit">Sign in</button>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <button type="button" class="btn-auth-secondary" onclick="window.location.href='register.html'">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>

            <a href="register.html" class="btn-auth-secondary">New to Soen AI? Join now</a>
        </form>
    </main>
</div>

<script src="assets/js/auth.js"></script>
<script>
document.querySelectorAll('.auth-pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target') || 'password';
        const input = document.getElementById(targetId);
        if (input) {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.textContent = isPassword ? 'Hide' : 'Show';
        }
    });
});
</script>
</body>
</html>
