<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Soen AI Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="brand-logo-icon">⚡</div>
            <h2>Soen AI</h2>
        </div>
        <h1>Create your account</h1>
        <p class="sub">Sign up with your email to start collaborating and building.</p>
        <div class="error-msg" id="errorMsg"></div>
        <form id="registerForm">
            <div class="field">
                <label for="username">Your Name / Handle</label>
                <input type="text" id="username" name="username" placeholder="alex" required autofocus>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="alex@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label for="password">Password (min. 6 characters)</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>
            <button class="btn btn-primary" type="submit">Create Free Account</button>
        </form>
        <div class="switch-link">Already have an account? <a href="login.html">Log in here</a></div>
    </div>
</div>
<script src="assets/js/auth.js"></script>
</body>
</html>
