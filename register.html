<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up | Soen AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap">
<link rel="stylesheet" href="assets/css/auth-clean.css?v=25.0">
</head>
<body class="auth-clean-body">

<div class="auth-page-shell">
    <div class="auth-clean-wrapper">
        <!-- Logo placed cleanly in page flow (NO separate taskbar) -->
        <a href="login.html" class="auth-brand-mark">
            <span class="logo-text">Soen</span><span class="logo-badge">AI</span>
        </a>

        <!-- Headline matching LinkedIn style -->
        <h1 class="auth-clean-title">Make the most of your<br>professional life</h1>

        <div class="error-msg" id="errorMsg"></div>

        <form id="registerForm" class="auth-clean-form">
            <div class="auth-field">
                <label for="username">Your name / handle</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="auth-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="auth-field">
                <label for="password">Password (6 or more characters)</label>
                <div class="auth-pw-wrap">
                    <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
                    <button type="button" class="auth-pw-toggle" data-target="password">Show</button>
                </div>
            </div>

            <p class="auth-legal-text">
                By clicking Agree &amp; Join, you agree to the Soen AI <a href="#">User Agreement</a>, <a href="#">Privacy Policy</a>, and <a href="#">Cookie Policy</a>.
            </p>

            <button class="btn-auth-primary" type="submit">Agree &amp; Join</button>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <button type="button" class="btn-auth-secondary" onclick="window.location.href='login.html'">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <a href="login.html" class="btn-auth-secondary">Already on Soen AI? Sign in</a>
        </form>
    </div>

    <!-- Production Trust Footer -->
    <footer class="auth-page-footer">
        <span class="auth-footer-copy">Soen AI &copy; 2026</span>
        <a href="#">User Agreement</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Community Guidelines</a>
        <a href="#">Cookie Policy</a>
        <a href="#">Help Center</a>
    </footer>
</div>

<script src="assets/js/auth.js"></script>
<script>
document.querySelectorAll('.auth-pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target') || 'password';
        const input = document.getElementById(targetId);
        if (input) {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            btn.textContent = isPassword ? 'Hide' : 'Show';
        }
    });
});
</script>
</body>
</html>
